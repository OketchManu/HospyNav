name: hospy_nav
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # Firebase plugins with compatible versions
  firebase_core: ^3.11.0
  firebase_storage: ^12.4.2
  cloud_firestore: ^5.6.3
  firebase_auth: ^5.4.2
  firebase_phone_auth_handler: ^1.0.8  # Downgraded to match older Firebase versions
  
  # Maps and location
  google_maps_flutter: ^2.5.3
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  geolocator_android: ^4.4.0
  flutter_dotenv: ^5.2.1
  
  # Rest of your dependencies remain the same
  google_sign_in: ^6.2.2
  local_auth: ^2.1.6
  url_launcher: ^6.2.4
  http: ^1.2.2
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.6
  logging: ^1.2.0
  intl: ^0.19.0
  provider: ^6.1.1
  image_picker: ^1.0.7
  cached_network_image: ^3.4.1
  go_router: ^14.3.0
  permission_handler: ^11.3.1
  logger: ^2.0.0
  location: ^8.0.0
  webview_flutter: ^4.4.4
  webview_flutter_web: ^0.2.3+2
  shared_preferences: ^2.2.2
  flutter_email_sender: ^6.0.3
  path_provider: ^2.1.2
  path: ^1.8.3
  youtube_player_flutter: ^9.1.1
  flutter_secure_storage: ^10.0.0-beta.4
  connectivity_plus: ^6.1.3
  flutter_animate: ^4.5.2
  animated_snack_bar: ^0.4.0
  lottie: ^3.1.0
  font_awesome_flutter: ^10.8.0
  image: ^4.1.3
  video_player: ^2.8.2
  mockito: ^5.4.5
  plugin_platform_interface: ^2.1.8
  build_runner: ^2.4.8
  share_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.3.10

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/google.png
    - assets/icons/phone.png
    - assets/images/doctor-and-patient.jpg
    - assets/images/background.png
    - assets/animations/signup.json
    - .env

flutter_native_splash:
  color: "#000000" # Black background as fallback
  image: assets/images/background.png
  android: true
  ios: true
  fullscreen: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icons/app_logo.png"
  adaptive_icon_background: "#000000"